<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada · Monitoria</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ec4899'/><path d='M30 50 L45 65 L70 35' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d10; --card:#14161d; --border:#282c38;
    --text-main:#f9fafb; --text-muted:#9ca3af;
    --primary:#ec4899; --primary-dark:#be185d;
    --gradient: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    --glow: rgba(236,72,153,0.35);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Inter', sans-serif;
    background:var(--bg); color:var(--text-main);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; overflow:hidden;
  }
  .glow{
    position:fixed; width:900px; height:900px; border-radius:50%;
    background:radial-gradient(circle, var(--glow) 0%, transparent 70%);
    top:50%; left:50%; transform:translate(-50%,-50%);
    pointer-events:none; z-index:0;
  }
  .wrap{
    position:relative; z-index:1; width:100%; max-width:560px;
    text-align:center; display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  .scene{ width:220px; height:150px; position:relative; }
  .scene svg{ width:100%; height:100%; overflow:visible; }
  .plane{ animation: float 3.4s ease-in-out infinite; transform-origin:center; }
  @keyframes float{
    0%,100%{ transform: translate(0,0) rotate(-6deg); }
    50%{ transform: translate(6px,-14px) rotate(-2deg); }
  }
  .path{ stroke-dasharray:6 8; opacity:.55; }
  .num{
    font-size:88px; font-weight:800; line-height:1;
    background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing:-2px;
  }
  h1{ font-size:24px; font-weight:700; letter-spacing:-0.3px; }
  p{ font-size:15px; color:var(--text-muted); line-height:1.6; max-width:420px; }
  .cta{
    margin-top:6px; display:inline-flex; align-items:center; gap:8px;
    padding:14px 28px; border-radius:12px; border:none; cursor:pointer;
    background:var(--gradient); color:#fff; font-size:15px; font-weight:700;
    text-decoration:none; box-shadow:0 8px 24px var(--glow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 12px 28px var(--glow); }
  .cta:focus-visible{ outline:2px solid #fff; outline-offset:3px; }
  .hint{ font-size:13px; color:var(--text-muted); opacity:.8; }
  @media (prefers-reduced-motion: reduce){
    .plane{ animation:none; }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="scene">
      <svg viewBox="0 0 220 150" fill="none">
        <path class="path" d="M10 120 C 60 40, 120 130, 205 55" stroke="#ec4899" stroke-width="2" fill="none"/>
        <g class="plane">
          <path d="M188 40 L214 52 L192 58 L186 70 L180 56 L154 50 Z" fill="#ec4899"/>
          <path d="M188 40 L192 58 L180 56 Z" fill="#be185d"/>
        </g>
        <circle cx="10" cy="120" r="4" fill="#ec4899" opacity="0.7"/>
      </svg>
    </div>

    <div class="num">404</div>
    <h1>Essa página se perdeu no caminho da aula</h1>
    <p>O link que você tentou abrir não existe nesta plataforma. Pode ter sido movido, digitado errado, ou simplesmente nunca existiu por aqui.</p>

    <a class="cta" href="/">Voltar para a Monitoria</a>
    <span class="hint">Se você acha que isso é um erro, avise um monitor.</span>
  </div>
</body>
</html>
